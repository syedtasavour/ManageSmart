name: Deploy

on:
  push:
    branches:
      - 'main'
      - 'stage/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Staging
        if: startsWith(github.ref_name, 'stage/')
        run: |
          echo "Deploying to staging environment..."
          # your staging deploy commands here, for example:
          # scp -r ./dist user@staging-server:/path
          # or call your staging deploy script

      - name: Deploy to Production
        if: github.ref_name == 'main'
        run: |
          echo "Deploying to production environment..."
          # your production deploy commands here
          # scp -r ./dist user@prod-server:/path
