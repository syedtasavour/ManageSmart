name: CI and Deploy

on:
  push:
    branches:
      - 'main'
      - 'stage/**'

jobs:
  deploy-staging:
    if: startsWith(github.ref_name, 'stage/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify Build Output
        run: ls -la dist

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --token=$VERCEL_TOKEN --scope $VERCEL_ORG_ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run Vercel Build
        run: vercel build --token=$VERCEL_TOKEN --scope $VERCEL_ORG_ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vercel Output
        run: ls -la .vercel/output

      - name: List all deployments
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" | \
            jq '.'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Delete non-staging deployments
        run: |
          DEPLOYMENTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")
          DEPLOYMENT_IDS=$(echo "$DEPLOYMENTS" | jq -r '.deployments[] | select(.meta.gitBranch | . == null or (startswith("stage/") | not)) | .uid')
          if [ -z "$DEPLOYMENT_IDS" ]; then
            echo "No non-staging deployments to delete"
          else
            echo "Deployments to delete: $DEPLOYMENT_IDS"
            for ID in $DEPLOYMENT_IDS; do
              echo "Deleting deployment $ID"
              curl -s -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v6/deployments/$ID?teamId=$VERCEL_ORG_ID" || true
            done
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Staging)
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes)
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Assign custom domain to staging deployment
        run: |
          # Retry mechanism to ensure deployment is registered
          for i in {1..5}; do
            sleep 5
            DEPLOYMENT_URL="${{ steps.deploy.outputs.deployment_url }}"
            echo "Attempt $i: Looking for deployment with URL: $DEPLOYMENT_URL"
            DEPLOYMENTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")
            DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | jq -r --arg url "$DEPLOYMENT_URL" '.deployments[] | select(.url == $url) | .uid // empty')
            if [ -n "$DEPLOYMENT_ID" ]; then
              echo "Found deployment ID: $DEPLOYMENT_ID for URL $DEPLOYMENT_URL"
              curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"name": "stage-managesmart.syedtasavour.me"}' \
                "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" || true
              echo "Assigned stage-managesmart.syedtasavour.me to deployment $DEPLOYMENT_ID"
              break
            fi
            echo "Attempt $i failed, retrying..."
          done
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Failed to find deployment ID after 5 attempts for URL $DEPLOYMENT_URL"
            echo "Available deployments: $(echo "$DEPLOYMENTS" | jq -r '.deployments[] | .url' || echo 'None')"
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify Build Output
        run: ls -la dist

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --token=$VERCEL_TOKEN --scope $VERCEL_ORG_ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run Vercel Build
        run: vercel build --prod --token=$VERCEL_TOKEN --scope $VERCEL_ORG_ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vercel Output
        run: ls -la .vercel/output

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes)
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: List all deployments
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" | \
            jq '.'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Delete non-staging and old production deployments
        run: |
          DEPLOYMENTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")
          CURRENT_DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | jq -r --arg url "${{ steps.deploy.outputs.deployment_url }}" '.deployments[] | select(.url == $url) | .uid // empty')
          DEPLOYMENT_IDS=$(echo "$DEPLOYMENTS" | jq -r --arg current_id "$CURRENT_DEPLOYMENT_ID" \
            '.deployments[] | select(.meta.gitBranch | . == null or (startswith("stage/") | not) and .uid != $current_id) | .uid')
          if [ -z "$DEPLOYMENT_IDS" ]; then
            echo "No non-staging or old production deployments to delete"
          else
            echo "Deployments to delete: $DEPLOYMENT_IDS"
            for ID in $DEPLOYMENT_IDS; do
              echo "Deleting deployment $ID"
              curl -s -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v6/deployments/$ID?teamId=$VERCEL_ORG_ID" || true
            done
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Assign custom domain to production deployment
        run: |
          # Retry mechanism to ensure deployment is registered
          for i in {1..5}; do
            sleep 5
            DEPLOYMENT_URL="${{ steps.deploy.outputs.deployment_url }}"
            echo "Attempt $i: Looking for deployment with URL: $DEPLOYMENT_URL"
            DEPLOYMENTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")
            DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | jq -r --arg url "$DEPLOYMENT_URL" '.deployments[] | select(.url == $url) | .uid // empty')
            if [ -n "$DEPLOYMENT_ID" ]; then
              echo "Found deployment ID: $DEPLOYMENT_ID for URL $DEPLOYMENT_URL"
              curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"name": "managesmart.syedtasavour.me"}' \
                "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" || true
              echo "Assigned managesmart.syedtasavour.me to deployment $DEPLOYMENT_ID"
              break
            fi
            echo "Attempt $i failed, retrying..."
          done
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Failed to find deployment ID after 5 attempts for URL $DEPLOYMENT_URL"
            echo "Available deployments: $(echo "$DEPLOYMENTS" | jq -r '.deployments[] | .url' || echo 'None')"
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
