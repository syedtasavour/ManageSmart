name: CI and Deploy (Hardcoded Token Test)

on:
  push:
    branches:
      - 'main'
      - 'stage/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  deploy-staging:
    needs: build
    if: startsWith(github.ref_name, 'stage/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Staging)
        run: |
          VERCEL_TOKEN=TPDpzpQvxcR9MVHGGhczaqdO vercel deploy --prebuilt --confirm

  deploy-production:
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        run: |
          VERCEL_TOKEN=TPDpzpQvxcR9MVHGGhczaqdO vercel deploy --prebuilt --prod --confirm
